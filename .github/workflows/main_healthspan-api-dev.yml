# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - healthspan-api-dev

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
          include-prerelease: true

      - name: Restore
        run: dotnet restore Tests/healthspan-api.tests/healthspan-api.tests.csproj

      - name: Build
        run: dotnet build healthspan-api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Tests/healthspan-api.tests/healthspan-api.tests.csproj --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish healthspan-api.csproj -c Release --no-restore -o ./publish
      
      - name: App Settings Variable Substitution
        uses: microsoft/variable-substitution@v1
        with:
          files: '**/appsettings.json'
        env:
          DbConnectionString: ${{ secrets.DBCONNECTIONSTRING }}
          GoogleClientId: ${{ secrets.GOOGLECLIENTID }}
          GoogleClientSecret: ${{ secrets.GOOGLECLIENTSECRET }}

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Apply EF migrations
        env:
          DbConnectionString: ${{ secrets.DBCONNECTIONSTRING }}
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.11
          dotnet-ef database update --project healthspan-api.csproj --configuration Release --no-build

  deploy:
    runs-on: windows-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EEA211849EEF4A7E94A83EB1DA593EFC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4493417C1AF044C59817F174F6F5CBB9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3A986910370E4CF6906717E99528A244 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'healthspan-api-dev'
          slot-name: 'Production'
          package: .

      
          
